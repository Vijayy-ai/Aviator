name: aviator

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aviator
      POSTGRES_PASSWORD: aviator
      POSTGRES_DB: aviator
    volumes:
      - aviator_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviator -d aviator"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]

  backend:
    build:
      context: ./aviator-backend
      dockerfile: Dockerfile
    env_file:
      - ./aviator-backend/.env
    environment:
      DJANGO_DEBUG: "1"
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql://aviator:aviator@db:5432/aviator
    volumes:
      - ./aviator-backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "
      python manage.py migrate &&
      daphne -b 0.0.0.0 -p 8000 config.asgi:application
      "

  game-engine:
    build:
      context: ./aviator-backend
      dockerfile: Dockerfile
    env_file:
      - ./aviator-backend/.env
    environment:
      DJANGO_DEBUG: "1"
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql://aviator:aviator@db:5432/aviator
    volumes:
      - ./aviator-backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py run_game_engine
      "

volumes:
  aviator_pg_data:
